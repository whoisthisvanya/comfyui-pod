name: build image
on:
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/build.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space (the base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag from the pinned ComfyUI commit
        id: tag
        run: echo "comfy=$(grep -oP 'COMFY_REF=\K[0-9a-f]{8}' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/comfyui-pod:latest
            ghcr.io/${{ github.repository_owner }}/comfyui-pod:comfy-${{ steps.tag.outputs.comfy }}
